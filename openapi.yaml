  /get_device_analytics:
    get:
      tags:
        - Device Interactions
      summary: Get Device Analytics
      operationId: getDeviceAnalytics
      x-badges:
        - { label: "Fan", color: green }
        - { label: "Water purifier", color: blue }
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl -sS -G "$ATOMBERG_BASE/get_device_analytics" \
              --data-urlencode "device_id=all" \
              -H "x-api-key: $ATOMBERG_API_KEY" \
              -H "Authorization: Bearer $ATOMBERG_ACCESS_TOKEN"
        - lang: Python
          label: Python
          source: |
            import os, requests

            BASE = os.environ["ATOMBERG_BASE"]
            HEADERS = {
                "x-api-key": os.environ["ATOMBERG_API_KEY"],
                "Authorization": f"Bearer {os.environ['ATOMBERG_ACCESS_TOKEN']}",
            }

            # NOTE: the response key is `device_state`, not `device_analytics`.
            rows = requests.get(
                f"{BASE}/get_device_analytics",
                params={"device_id": "all"},
                headers=HEADERS,
                timeout=10,
            ).json()["message"]["device_state"]

            for row in rows:
                if "power_consumption" in row:         # fan
                    print(row["device_id"], row["power_consumption"], "kWh,",
                          row.get("runtime"), "h")
                elif "water_saved_liters" in row:      # water purifier
                    print(row["device_id"], row["water_saved_liters"], "L,",
                          row.get("uv_runtime_hours"), "h UV")

            # Locks have no analytics. With device_id=all they are left out of the response.
        - lang: JavaScript
          label: JavaScript
          source: |
            const BASE = process.env.ATOMBERG_BASE;
            const headers = {
              "x-api-key": process.env.ATOMBERG_API_KEY,
              Authorization: `Bearer ${process.env.ATOMBERG_ACCESS_TOKEN}`,
            };

            const url = new URL(`${BASE}/get_device_analytics`);
            url.searchParams.set("device_id", "all");

            // NOTE: the response key is `device_state`, not `device_analytics`.
            const { message } = await (await fetch(url, { headers })).json();

            for (const row of message.device_state) {
              if ("power_consumption" in row) console.log(row.device_id, row.power_consumption, "kWh");
              else if ("water_saved_liters" in row) console.log(row.device_id, row.water_saved_liters, "L");
            }
      description: |
        Total usage figures. Fans report energy used and running time. Water purifiers report water saved and UV lamp running time.

        Smart locks have no analytics. With `device_id=all`, locks are left out. Asking for a lock by its `device_id` returns a `400`.

        If a device has never reported these counters, the fields are `null`, not zero. This way you can tell "no data yet" apart from a real zero.

        ## Fan figures

        | Field | Unit | Meaning |
        | --- | --- | --- |
        | power_consumption | kWh | Total energy used |
        | runtime | hours | Total running time |

        ## Water purifier figures

        | Field | Unit | Meaning |
        | --- | --- | --- |
        | water_saved_liters | litres | Water a comparable 25% recovery unit would have sent to drain (the RO you replaced with Intellon most likely had 25% recovery) |
        | uv_runtime_hours | hours | Total UV lamp running time. Useful for planning lamp replacement |

        `water_saved_liters` is calculated as **RO litres x 1.5 + UF litres x 3**.

        The response key is `device_state`, not `device_analytics`. The name is kept so existing integrations keep working.

        ## Request

        | Where | Name | Required | Value |
        | --- | --- | --- | --- |
        | Header | `x-api-key` | Yes | Your developer API key. |
        | Header | `Authorization` | Yes | `Bearer <access_token>` |
        | Query | `device_id` | Yes | One `device_id`, or `all` for every supported device. |

        No request body. There is no date range. The figures are lifetime totals
        reported by the device.

        ## Response

        ```json
        {
          "status": "Success",
          "message": {
            "device_state": [
              { "device_id": "6867258b9d78", "power_consumption": 41.2, "runtime": 613.5 },
              { "device_id": "a0764ee4210c", "water_saved_liters": 1284.5, "uv_runtime_hours": 219.0 }
            ]
          }
        }
        ```

        Only fans and water purifiers have analytics. With `device_id=all`, devices
        without analytics are left out.
      parameters:
        - name: device_id
          in: query
          required: true
          schema:
            type: string
          example: all
          description: One device_id, or `all` for every supported device.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAnalyticsResponse'
              examples:
                fan:
                  summary: Fan
                  value:
                    status: Success
                    message:
                      device_state:
                        - device_id: 6867258b9d78
                          power_consumption: 2.4
                          runtime: 18.5
                waterPurifier:
                  summary: Water purifier
                  value:
                    status: Success
                    message:
                      device_state:
                        - device_id: a0764ee4210c
                          water_saved_liters: 2570.7
                          uv_runtime_hours: 5
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /send_command:
    post:
      tags:
        - Device Interactions
      summary: Send Command
      operationId: sendCommand
      x-badges:
        - { label: "Fan", color: green }
        - { label: "Water purifier", color: blue }
        - { label: "Not for locks", color: red }
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            # Fan: turn on and set the speed
            curl -sS -X POST "$ATOMBERG_BASE/send_command" \
              -H "x-api-key: $ATOMBERG_API_KEY" \
              -H "Authorization: Bearer $ATOMBERG_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"device_id":"'"$ATOMBERG_DEVICE_ID"'","command":{"power":true,"speed":4}}'

            # Water purifier: change the mode
            curl -sS -X POST "$ATOMBERG_BASE/send_command" \
              -H "x-api-key: $ATOMBERG_API_KEY" \
              -H "Authorization: Bearer $ATOMBERG_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"device_id":"'"$ATOMBERG_DEVICE_ID"'","command":{"mode":4}}'
        - lang: Python
          label: Python
          source: |
            import os, requests

            BASE = os.environ["ATOMBERG_BASE"]
            HEADERS = {
                "x-api-key": os.environ["ATOMBERG_API_KEY"],
                "Authorization": f"Bearer {os.environ['ATOMBERG_ACCESS_TOKEN']}",
                "Content-Type": "application/json",
            }

            def send(device_id, command):
                r = requests.post(
                    f"{BASE}/send_command",
                    json={"device_id": device_id, "command": command},
                    headers=HEADERS,
                    timeout=10,
                )
                if r.status_code == 400:
                    # The message names the wrong key and lists what this series
                    # accepts. Show it instead of retrying.
                    raise ValueError(r.json()["message"])
                r.raise_for_status()
                return r.json()

            # Several keys in one call are checked together. If one of them is
            # invalid for the device, the whole call is rejected.
            send(os.environ["ATOMBERG_DEVICE_ID"], {"power": True, "speed": 4})

            # 200 means the command was ACCEPTED, not that it was APPLIED. To confirm
            # the change, call get_device_state after a second or two.
        - lang: JavaScript
          label: JavaScript
          source: |
            const BASE = process.env.ATOMBERG_BASE;
            const headers = {
              "x-api-key": process.env.ATOMBERG_API_KEY,
              Authorization: `Bearer ${process.env.ATOMBERG_ACCESS_TOKEN}`,
              "Content-Type": "application/json",
            };

            async function send(deviceId, command) {
              const res = await fetch(`${BASE}/send_command`, {
                method: "POST",
                headers,
                body: JSON.stringify({ device_id: deviceId, command }),
              });
              const body = await res.json();
              if (!res.ok) throw new Error(body.message); // names the key and its valid values
              return body;
            }

            await send(process.env.ATOMBERG_DEVICE_ID, { power: true, speed: 4 });

            // 200 means the command was ACCEPTED, not that it was APPLIED. To confirm
            // the change, call get_device_state after a second or two.
      description: |
        Send a command to a device. You need the device_id of the device you want to control. You can get it from the 'Get List of Devices' API. The full list of commands is:

        | Command | Description | JSON | Accepted values for val | Comments |
        | --- | --- | --- | --- | --- |
        | Power | Turn the fan ON or OFF | {"power":val} | true or false |  |
        | Speed Absolute | Set the speed to an absolute value | {"speed":val} | an integer from 1 to 6 |  |
        | Speed Relative | Increase/decrease the speed | {"speedDelta":val} | one of -5, -4, -3, -2, -1, 1, 2, 3, 4, 5 |  |
        | Sleep mode | Enable or disable sleep mode | {"sleep":val} | true or false |  |
        | Timer | Set a preset timer | {"timer":val} | one of 0, 1, 2, 3, 4 | 0: off <br>1: 1 hour <br>2: 2 hours <br>3: 3 hours <br>4: 6 hours |
        | Lights ON/OFF | Turn the light ON or OFF | {"led":val} | true or false | On Aris Starlight it restores the last known colour and brightness |
        | Reverse | Reverse the direction of rotation | {"rev_mode":val} | true or false |  |
        | Brightness Absolute | Set brightness to an absolute value | {"brightness":val} | an integer from 10 to 100 | Percentage |
        | Brightness Delta | Increase/decrease brightness | {"brightnessDelta":val} | an integer from -90 to 90 | Percentage |
        | Colour | Change the colour of the light | {"light_mode":val} | one of "warm", "cool", "daylight" |  |
        | Buzzer | Enable or disable audible feedback | {"buzzer_status":val} | true or false |  |

        Every fan accepts the **Base** commands. The other columns add more commands:

        | Column | Commands it adds |
        | --- | --- |
        | Base | power, speed, speedDelta, sleep, timer, led |
        | Brightness | brightness, brightnessDelta |
        | Colour | light_mode |
        | Extras | rev_mode, buzzer_status |

        If you send a command that a series does not support (`No` in its column), you get a `400` error. The message lists the commands that series accepts.

        | Model | Series | Base | Brightness | Colour | Extras |
        | --- | --- | --- | --- | --- | --- |
        | Renesa / Renesa+ / Studio+ | R1, R2, R3, R4, R6 | Yes | No | No | No |
        | Aris | I2 | Yes | No | No | No |
        | Erica | K1 | Yes | No | No | No |
        | Renesa Fusion | R5 | Yes | No | No | No |
        | Aris Gladius | I3, I4 | Yes | No | No | No |
        | Aris Contour | M1, M2, M3 | Yes | Yes | No | No |
        | Renesa Elite / Studio Nexus | S1, S2, S3 | Yes | Yes | No | No |
        | Aris Starlight | I1, I5 | Yes | Yes | Yes | No |
        | Emperion Magna | O1 | Yes | Yes | Yes | Yes |
        # Water purifier commands

        Water purifiers have their own set of commands. **Send one command key per message.** A request with two commands is rejected. The only exception is the `sleep_mode` sub-keys (`start_utc` and `stop_utc`). They are sent with `sleep_mode` and do not count as separate commands.

        | Command | Description | JSON | Accepted values for val | Comments |
        | --- | --- | --- | --- | --- |
        | Mode | Set the purification mode | {"mode":val} | 0, 1, 2, 3, 4, 10 | See the mode table below |
        | Fallback mode | Mode used when the device falls back from the selected mode | {"fallback_mode":val} | 0, 2, 3, 4 | RO_ONLY or a TasteTune mode. ADAPTIVE and Vacay are not allowed |
        | TDS threshold | Input TDS threshold that decides RO vs UF treatment | {"tds_threshold":val} | 100 to 300 | Parts per million |
        | Idle sleep | Turn off the display and lights while the unit is idle | {"idle_sleep":val} | 0, 1 | 0: off, 1: on |
        | Sleep window on | Turn on the daily sleep window | {"sleep_mode":1,<br>"start_utc":start,<br>"stop_utc":stop} | start and stop: uint32 epoch seconds | Send all three keys **together** in one message. See Sleep window sub-keys below |
        | Sleep window off | Turn off the daily sleep window | {"sleep_mode":0} | - | Send it on its own. start_utc and stop_utc are not accepted with 0 |

        ## Purification modes

        | Value | Mode | Meaning |
        | --- | --- | --- |
        | 0 | RO_ONLY | Always use RO treatment |
        | 1 | ADAPTIVE | Bypass RO |
        | 2 | TasteTune 50-100 | Keeps purified water TDS between 50 and 100 ppm |
        | 3 | TasteTune 75-125 | Keeps purified water TDS between 75 and 125 ppm |
        | 4 | TasteTune 100-150 | Keeps purified water TDS between 100 and 150 ppm |
        | 10 | Vacay | Holiday mode |

        ## Sleep window sub-keys

        `start_utc` and `stop_utc` are sub-keys of `sleep_mode`. Send them only with `sleep_mode` set to `1`, in the same message. They do not count as separate commands. In 'Get List of Devices', `sleep_mode` lists them under `requires`, and each one has `sub_key_of: "sleep_mode"`.

        | Sub-key | Sent with | Accepted values | Meaning |
        | --- | --- | --- | --- |
        | start_utc | "sleep_mode": 1 | uint32 epoch seconds | Start of the daily sleep window |
        | stop_utc | "sleep_mode": 1 | uint32 epoch seconds | End of the daily sleep window |

        ```json
        {
          "device_id": "a0764ee4210c",
          "command": { "sleep_mode": 1, "start_utc": 1767304800, "stop_utc": 1767330000 }
        }
        ```

        Send `start_utc` and `stop_utc` as **numbers, not strings**. Only the time of day is used (epoch modulo 86400), so the window repeats every day. To turn the window off, send `{"sleep_mode":0}` on its own.

        # Smart locks

        Locks do not accept commands through this API. A command sent to a G1 Cypheo Elite or an Azhero Smart Door Lock / SL1 returns a `400`. This is also why `supported_commands` is empty for locks in 'Get List of Devices'. Use 'Get Device State' to read a lock and 'Get Lock Dynamic PIN' to create a guest PIN.

        # Sending the command locally

        **Local control over UDP is currently available for fans only.** To control water purifiers, use the 'Send Command' API.

        You can control the fans locally over UDP, without having to rely on the cloud API. The steps involved are as follows:
        ## Step 1: Check if the device is available on the local network. 
        Each device sends a beacon packet over UDP every one second on port 5625. This beacon packet contains the MAC address of the device, followed by the series (mac_series). You can have a background service that listens for the beacon packets and stores the mapping of MAC against the IP address.
        A sample implementation in Python is given below:
        ```plaintext
        import socket
        import threading
        import time

        # Define the UDP port to listen on
        UDP_IP = "0.0.0.0"  # Listen on all available interfaces
        UDP_PORT = 5625
        BUFFER_SIZE = 4096  # Adjust as needed
        TIMEOUT = 2  # seconds

        available_devices = {}
        lock = threading.Lock()

        def cleanup_inactive_devices():
            while True:
                now = time.time()
                with lock:
                    inactive_devices = [mac for mac, (ip, ts) in available_devices.items() if now - ts > TIMEOUT]
                    for mac in inactive_devices:
                        print(f"Removing inactive device: {mac}")
                        del available_devices[mac]
                time.sleep(1) 

        def main():
            # Create a UDP socket
            sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)

            # Bind the socket to the IP and port
            sock.bind((UDP_IP, UDP_PORT))
            print(f"Listening for UDP packets on port {UDP_PORT}...")

            # Start background cleanup thread
            threading.Thread(target=cleanup_inactive_devices, daemon=True).start()

            try:
                while True:
                    data, addr = sock.recvfrom(BUFFER_SIZE)  # Receive packet
                    ip, port = addr
                    content = data.decode(errors='replace')
                    if len(content) <= 15:
                        print("Beacon packet received")
                        mac = content[:12]
                        with lock:
                            available_devices[mac] = (ip,time.time())
                    print(f"Received packet from {ip}:{port}")
                    print(f"available device data: {available_devices}")
                    # You can also store this in a file or database if needed
            except KeyboardInterrupt:
                print("\nStopped by user.")
            finally:
                sock.close()

        if __name__ == "__main__":
            main()
        ```
        ## Step 2: Send the command to the device
        If you have identified the MAC address of the device to which you wish to send the command, you can use the command JSONs (described above) to send the command to the intended device.
        An example implementation in Python is given below:
        ```plaintext
        import json
        import socket 

        TARGET_IP = "192.168.29.233"
        TARGET_PORT = 5600

        # JSON command to send command = {
            "led":False
        }

        # Convert to JSON string and encode to bytes
        message = json.dumps(command).encode('utf-8')

        # Create UDP socket
        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)

        # Send the message
        sock.sendto(message, (TARGET_IP, TARGET_PORT))
        print(f"Sent JSON command to {TARGET_IP}:{TARGET_PORT}")

        # Close the socket
        sock.close()
        ```

        ## Request

        | Where | Name | Required | Value |
        | --- | --- | --- | --- |
        | Header | `x-api-key` | Yes | Your developer API key. |
        | Header | `Authorization` | Yes | `Bearer <access_token>` |
        | Header | `Content-Type` | Yes | `application/json` |

        ```json
        {
          "device_id": "6867258b9d78",
          "command": { "power": true, "speed": 4 }
        }
        ```

        | Field | Type | Required | Meaning |
        | --- | --- | --- | --- |
        | `device_id` | string | Yes | A device on your account. `all` is **not** accepted here. |
        | `command` | object | Yes | One or more command keys, as a JSON object (not an array or a string). |

        Every key in `command` is checked against the device's series before anything
        is sent. If one key is invalid, the whole message is rejected and nothing is
        applied. The `400` error names the wrong key and lists what that series
        accepts.

        ## Response

        ```json
        {
          "status": "Success",
          "message": "Command sent successfully"
        }
        ```

        ### Accepted does not mean applied

        `200` means the command was checked and sent to the device. It does **not**
        mean the device has acted on it yet.

        If the device is offline, you get a `503` error and the command is not
        delivered. A device can still miss a command if it drops off Wi-Fi at that
        moment. To confirm the change, call 'Get Device State' after a second or two
        and compare the values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - device_id
                - command
              properties:
                device_id:
                  type: string
                  description: From 'Get List of Devices'.
                command:
                  type: object
                  description: >-
                    One or more command keys. Water purifiers accept only one key
                    per message.
            examples:
              fanPower:
                summary: 'Fan: turn on'
                value:
                  device_id: 6867258b9d78
                  command:
                    power: true
              fanSpeed:
                summary: 'Fan: set speed'
                value:
                  device_id: 6867258b9d78
                  command:
                    speed: 3
              fanColour:
                summary: 'Fan: set light colour (I1, I5, O1)'
                value:
                  device_id: 6867258b9d78
                  command:
                    light_mode: warm
              purifierMode:
                summary: 'Purifier: set purification mode'
                value:
                  device_id: a0764ee4210c
                  command:
                    mode: 4
              purifierSleepWindow:
                summary: 'Purifier: daily sleep window'
                value:
                  device_id: a0764ee4210c
                  command:
                    sleep_mode: 1
                    start_utc: 1767304800
                    stop_utc: 1767330000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
              example:
                status: Success
                message: Message sent successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /get_lock_dynamic_pin:
    post:
      tags:
        - Locks
      summary: Get Lock Dynamic PIN
      operationId: getLockDynamicPin
      x-badges:
        - { label: "Smart lock", color: orange }
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            # G1 Cypheo Elite: send only the device_id.
            curl -sS -X POST "$ATOMBERG_BASE/get_lock_dynamic_pin" \
              -H "x-api-key: $ATOMBERG_API_KEY" \
              -H "Authorization: Bearer $ATOMBERG_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"device_id":"'"$ATOMBERG_LOCK_ID"'"}'

            # Azhero Smart Door Lock / SL1 (series smart_lock_black): a time window is
            # required. Epoch SECONDS, end after start.
            curl -sS -X POST "$ATOMBERG_BASE/get_lock_dynamic_pin" \
              -H "x-api-key: $ATOMBERG_API_KEY" \
              -H "Authorization: Bearer $ATOMBERG_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"device_id":"'"$ATOMBERG_LOCK_ID"'","start_time":1767304800,"end_time":1767330000}'
        - lang: Python
          label: Python
          source: |
            import os, time, requests

            BASE = os.environ["ATOMBERG_BASE"]
            HEADERS = {
                "x-api-key": os.environ["ATOMBERG_API_KEY"],
                "Authorization": f"Bearer {os.environ['ATOMBERG_ACCESS_TOKEN']}",
                "Content-Type": "application/json",
            }

            def guest_pin(device_id, series):
                body = {"device_id": device_id}
                # Only the Azhero Smart Door Lock / SL1 (series smart_lock_black) takes a
                # time window. G1 makes the PIN from the clock, so it does not need one.
                if series == "smart_lock_black":
                    start = int(time.time())
                    body["start_time"] = start          # UTC epoch SECONDS
                    body["end_time"] = start + 4 * 3600  # must be greater
                r = requests.post(f"{BASE}/get_lock_dynamic_pin", json=body,
                                  headers=HEADERS, timeout=10)
                r.raise_for_status()
                return r.json()["message"]["data"]

            data = guest_pin(os.environ["ATOMBERG_LOCK_ID"], "G1")

            # Always read the time window from the response. For G1 it is short.
            # For Azhero / SL1 it can be WIDER than you asked for, because an
            # existing guest PIN that already covers it is reused.
            print(data["otp"], data["validStartTime"], data["validEndTime"])
        - lang: JavaScript
          label: JavaScript
          source: |
            const BASE = process.env.ATOMBERG_BASE;
            const headers = {
              "x-api-key": process.env.ATOMBERG_API_KEY,
              Authorization: `Bearer ${process.env.ATOMBERG_ACCESS_TOKEN}`,
              "Content-Type": "application/json",
            };

            async function guestPin(deviceId, series) {
              const body = { device_id: deviceId };
              // Only the Azhero Smart Door Lock / SL1 (series smart_lock_black) takes a
              // time window. G1 uses the clock.
              if (series === "smart_lock_black") {
                const start = Math.floor(Date.now() / 1000); // epoch SECONDS
                body.start_time = start;
                body.end_time = start + 4 * 3600;            // must be greater
              }
              const res = await fetch(`${BASE}/get_lock_dynamic_pin`, {
                method: "POST", headers, body: JSON.stringify(body),
              });
              const payload = await res.json();
              if (!res.ok) throw new Error(payload.message);
              return payload.message.data;
            }

            const data = await guestPin(process.env.ATOMBERG_LOCK_ID, "G1");
            // Always read the time window from the response.
            console.log(data.otp, data.validStartTime, data.validEndTime);
      description: |
        Creates a temporary guest PIN for a smart lock.

        PINs work differently on each lock, and each lock needs different inputs:

        | Lock | Series | Send | PIN | Usable for |
        | --- | --- | --- | --- | --- |
        | Cypheo Elite | G1 | `device_id` only | 10 digits | about 15 minutes |
        | Azhero Smart Door Lock / SL1 | smart_lock_black | `device_id`, `start_time`, `end_time` | 6 digits | the time window you asked for |

        ## How the PIN works on each lock

        **For G1 Cypheo Elite, the PIN comes from the clock.** It is based on the minute it was created. The lock works out the same PIN from its own clock and checks that they match. Nothing is sent to the lock or stored, so the lock does not need to be online. The PIN works for about 15 minutes and you cannot choose the time window. `start_time` and `end_time` are not needed and are ignored if sent.

        **For the Azhero Smart Door Lock / SL1, the PIN is stored on the lock** for the time window you choose, so you must send `start_time` and `end_time`. If a guest PIN already on the lock covers your time window, that PIN is returned and no new one is created.

        ## Request

        | Where | Name | Required | Value |
        | --- | --- | --- | --- |
        | Header | `x-api-key` | Yes | Your developer API key. |
        | Header | `Authorization` | Yes | `Bearer <access_token>` |
        | Header | `Content-Type` | Yes | `application/json` |
        | Body | `device_id` | Yes | A lock on your account. |
        | Body | `start_time` | Only for Azhero / SL1 | When the PIN starts working. UTC epoch **seconds**. Ignored by G1. |
        | Body | `end_time` | Only for Azhero / SL1 | When the PIN stops working. UTC epoch **seconds**, later than `start_time`. Ignored by G1. |

        If the `device_id` is not a lock, you get a `400` error that says what kind of device it is.

        Both time fields are epoch **seconds**, not milliseconds. If you send milliseconds, the time window will be far too long.

        ## Response

        ```json
        {
          "status": "Success",
          "message": {
            "data": {
              "otp": "482913",
              "validStartTime": 1767304800,
              "validEndTime": 1767305039
            }
          }
        }
        ```

        | Field | Type | Meaning |
        | --- | --- | --- |
        | `message.data.otp` | string | The PIN to give your guest. It is a string, not a number, because it can start with 0. |
        | `message.data.validStartTime` | integer | When it starts working, epoch seconds. |
        | `message.data.validEndTime` | integer | When it stops working, epoch seconds. |

        **Always use the time window from the response.** For G1, the time window is short and set by the lock. For Azhero / SL1, it can be *wider* than you asked for, because an existing guest PIN that covers your time window is reused.

        A PIN **cannot be cancelled** before it expires, so ask for short time windows.

        When an Azhero Smart Door Lock / SL1 creates a new PIN, the API returns the reply from the lock's own platform without changing it. Its format can differ from the example above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - device_id
              properties:
                device_id:
                  type: string
                  description: A lock on your account, from 'Get List of Devices'.
                  example: aabbccddee01
                start_time:
                  type: integer
                  format: int64
                  description: >-
                    Required only for the Azhero Smart Door Lock / SL1 (series
                    `smart_lock_black`). When the PIN starts working, in UTC epoch
                    seconds. Ignored by G1.
                  example: 1767304800
                end_time:
                  type: integer
                  format: int64
                  description: >-
                    Required only for the Azhero Smart Door Lock / SL1 (series
                    `smart_lock_black`). When the PIN stops working, in UTC epoch
                    seconds, later than `start_time`. Ignored by G1.
                  example: 1767330000
            examples:
              clockBased:
                summary: 'G1 Cypheo Elite: device_id only'
                value:
                  device_id: aabbccddee01
              provisioned:
                summary: 'Azhero Smart Door Lock / SL1: time window required'
                value:
                  device_id: aabbccddee03
                  start_time: 1767304800
                  end_time: 1767330000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicPinResponse'
              example:
                status: Success
                message:
                  data:
                    otp: '482913'
                    validStartTime: 1767304800
                    validEndTime: 1767305039
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'